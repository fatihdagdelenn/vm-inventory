{% extends "base.html" %}
{% block content %}
<!-- Google benzeri hızlı arama -->
<div class="search-hero mb-3">
  <div class="search-box">
    <i class="bi bi-search"></i>
    <input type="text" id="vmSearch" class="form-control form-control-lg"
           placeholder='Ara…  örn: ip:10.10.10.15  os:linux  ram:>=16  -cluster:test  status:running' data-i18n-ph="vm.searchPh">
    <div class="dropdown">
      <button class="btn btn-link p-0 me-1" id="savedBtn" type="button" data-bs-toggle="dropdown"
              data-bs-auto-close="outside" data-i18n-title="vm.savedSearches" title="Kayıtlı aramalar">
        <i class="bi bi-bookmark-star"></i></button>
      <div class="dropdown-menu dropdown-menu-end saved-menu p-0" id="savedMenu"></div>
    </div>
    <button class="btn btn-link p-0 me-1" id="searchHelp" data-i18n-title="vm.searchHelp" title="Arama söz dizimi"><i class="bi bi-question-circle"></i></button>
    <button class="btn btn-link p-0" id="searchClear" data-i18n-title="vm.clear" title="Temizle"><i class="bi bi-x-lg"></i></button>
  </div>

  <!-- Araç çubuğu (faz147): tek satır. Hızlı filtre grupları açılır menüdür
       (VMs.renderQuickFilters çizer): menüde çoklu seçim, Shift+tık hariç tutar,
       düğme seçimi özetler. Her seçim arama kutusundaki bir token'dır. -->
  <div class="vm-toolbar mt-2">
    <div class="qf-menus" id="quickFilters"></div>
    <span class="vm-toolbar-sep"></span>
    <button class="qf-btn" type="button" data-bs-toggle="collapse" data-bs-target="#advFilters">
      <i class="bi bi-sliders"></i> <span data-i18n="vm.advanced">Gelişmiş</span>
      <span id="advCount" class="qf-btn-badge d-none"></span>
    </button>
    <div class="qf-groupby" data-i18n-title="vm.groupBy" title="Grupla">
      <i class="bi bi-collection"></i>
      <select id="groupBy" class="form-select form-select-sm">
        <option value="" data-i18n="vm.groupNone">Gruplama yok</option>
        <option value="cluster" data-i18n="vm.byCluster">Cluster'a göre</option>
        <option value="os" data-i18n="vm.byOs">İşletim sistemine göre</option>
        <option value="vlan" data-i18n="vm.byVlan">VLAN'a göre</option>
        <option value="environment" data-i18n="vm.byEnv">Ortama göre</option>
        <option value="location" data-i18n="vm.byLocation">Lokasyona göre</option>
        <option value="tag" data-i18n="vm.byTag">Etikete göre</option>
      </select>
    </div>
  </div>

  <!-- Aktif filtre rozetleri: X ile tek tek kaldırılabilir -->
  <div id="activeFilters" class="active-filters mt-2 d-none"></div>

  <!-- Gelişmiş filtre paneli: seçimler arama kutusuna söz dizimi olarak yansır -->
  <div class="collapse mt-3" id="advFilters">
    <div class="adv-panel">
      <div class="row g-2">
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Platform</label>
          <select class="form-select form-select-sm adv-sel" data-field="platform"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Cluster</label>
          <select class="form-select form-select-sm adv-sel" data-field="cluster"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Host / Node</label>
          <select class="form-select form-select-sm adv-sel" data-field="host"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1" data-i18n="th.status">Durum</label>
          <select class="form-select form-select-sm adv-sel" data-field="status"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1" data-i18n="vm.env">Ortam</label>
          <select class="form-select form-select-sm adv-sel" data-field="env"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">VLAN</label>
          <select class="form-select form-select-sm adv-sel" data-field="vlan"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1" data-i18n="vm.os">İşletim Sistemi</label>
          <select class="form-select form-select-sm adv-sel" data-field="osfam"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1" data-i18n="vm.tag">Etiket</label>
          <select class="form-select form-select-sm adv-sel" data-field="tag"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Pool</label>
          <select class="form-select form-select-sm adv-sel" data-field="pool"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1" data-i18n="vm.folder">Klasör</label>
          <select class="form-select form-select-sm adv-sel" data-field="folder"></select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Tools / Agent</label>
          <select class="form-select form-select-sm adv-sel" data-field="tools">
            <option value="" data-i18n="vm.allOption">— Tümü —</option>
            <option value="running" data-i18n="st.running">Çalışıyor</option>
            <option value="yok" data-i18n="vm.notInstalled">Kurulu değil</option>
          </select></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Min CPU</label>
          <input type="number" min="1" class="form-control form-control-sm adv-num" data-field="cpu" data-i18n-ph="vm.eg4" placeholder="örn: 4"></div>
        <div class="col-6 col-md-4 col-xl-2"><label class="form-label small mb-1">Min RAM (GB)</label>
          <input type="number" min="1" class="form-control form-control-sm adv-num" data-field="ram" data-i18n-ph="vm.eg16" placeholder="örn: 16"></div>
        <div class="col-6 col-md-4 col-xl-2 d-flex align-items-end">
          <div class="form-check form-switch mb-1">
            <input class="form-check-input" type="checkbox" role="switch" id="incHidden">
            <label class="form-check-label small" for="incHidden" data-i18n="vm.includeHidden">Gizli cluster'ları dahil et</label>
          </div></div>
        <div class="col-6 col-md-4 col-xl-2 d-flex align-items-end">
          <button class="btn btn-sm btn-outline-secondary w-100" onclick="VMs.clearAdvanced()">
            <i class="bi bi-x-circle"></i> <span data-i18n="vm.clearFilters">Filtreleri Temizle</span></button></div>
      </div>
    </div>
  </div>
</div>

<!-- Arama söz dizimi yardım modalı (içerik vms.js > VMs.renderHelp, örnekler tıklanabilir) -->
<div class="modal fade" id="helpModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title"><i class="bi bi-question-circle"></i> <span data-i18n="vm.searchSyntax">Arama Söz Dizimi</span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body help-body" id="helpBody"></div>
    </div>
  </div>
</div>

<div id="groupResults" class="row g-2 mb-3 d-none"></div>

<div class="card panel">
  <!-- Tablo başlığı: sonuç sayısı + tablo işlemleri (kolonlar, dışa aktarma) -->
  <div class="vm-table-head">
    <span class="vm-count" id="vmCount"></span>
    <div class="vm-table-actions">
      <div class="dropdown">
        <button class="qf-btn" type="button"
                data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' data-bs-auto-close="outside" data-i18n-title="vm.chooseCols" title="Görünür kolonları seç">
          <i class="bi bi-layout-three-columns"></i> <span data-i18n="vm.columns">Kolonlar</span> <i class="bi bi-chevron-down qf-caret"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end p-2" id="colChooser"
             style="max-height:60vh; overflow:auto; min-width:200px"></div>
      </div>
      <div class="dropdown">
        <button class="qf-btn" type="button" data-bs-toggle="dropdown" data-bs-popper-config='{"strategy":"fixed"}' data-i18n-title="vm.export" title="Dışa aktar">
          <i class="bi bi-download"></i> <span data-i18n="vm.export">Dışa aktar</span> <i class="bi bi-chevron-down qf-caret"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end">
          <button class="dropdown-item" type="button" onclick="VMs.exportNow('xlsx')"><i class="bi bi-file-earmark-excel text-success"></i> Excel (.xlsx)</button>
          <button class="dropdown-item" type="button" onclick="VMs.exportNow('csv')"><i class="bi bi-filetype-csv text-secondary"></i> CSV</button>
          <button class="dropdown-item" type="button" onclick="VMs.exportNow('pdf')"><i class="bi bi-file-earmark-pdf text-danger"></i> PDF</button>
          <div class="dropdown-divider"></div>
          <span class="dropdown-item-text small text-muted" data-i18n="vm.exportHint">Geçerli arama uygulanır</span>
        </div>
      </div>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0" id="vmTable">
      <thead>
        <tr>
          <th data-col="name" data-sort="name" class="sortable" data-i18n="th.vmName">VM Adı</th>
          <th data-col="vmid" data-sort="vmid" class="sortable">VM ID</th>
          <th data-col="ip" data-i18n="vm.ipAddresses">IP Adresleri</th>
          <th data-col="guest_os" data-sort="guest_os" class="sortable" data-i18n="vm.os">İşletim Sistemi</th>
          <th data-col="platform" data-sort="platform" class="sortable">Platform</th>
          <th data-col="agent" data-sort="agent" class="sortable">Agent</th>
          <th data-col="cpu" data-sort="cpu_count" class="sortable">CPU</th>
          <th data-col="ram" data-sort="ram_mb" class="sortable">RAM</th>
          <th data-col="disk" data-sort="disk_total_gb" class="sortable">Disk</th>
          <th data-col="host" data-sort="host" class="sortable">Host</th>
          <th data-col="cluster" data-sort="cluster" class="sortable">Cluster</th>
          <th data-col="pool" data-sort="pool" class="sortable">Pool</th>
          <th data-col="folder" data-col-default="0" data-i18n="vm.folder">Klasör</th>
          <th data-col="vlan">VLAN</th>
          <th data-col="ptags">Tags</th>
          <th data-col="power_state" data-sort="power_state" class="sortable" data-i18n="th.status">Durum</th>
          <th data-col="uptime" data-sort="uptime" class="sortable">Uptime</th>
        </tr>
      </thead>
      <tbody id="vmBody"><tr><td colspan="17" class="text-center text-muted p-4" data-i18n="common.loading">Yükleniyor…</td></tr></tbody>
    </table>
  </div>
  <div class="card-footer d-flex align-items-center">
    <nav class="ms-auto"><ul class="pagination pagination-sm mb-0" id="vmPager"></ul></nav>
  </div>
</div>

{% endblock %}
{% block scripts %}<script src="/static/js/vms.js?v={{ asset_version }}"></script>{% endblock %}
